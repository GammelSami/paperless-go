name: Upstream sync

# Weekly: merge ventouxlabs/paperless-go main into this fork, then trigger a release.
# Merge conflict → job fails, GitHub mails the owner, merge by hand.
# ponytail: pushes made with GITHUB_TOKEN can't change .github/workflows; if upstream touches them, sync by hand.

on:
  schedule:
    - cron: '0 4 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Merge upstream
        id: merge
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          git fetch https://github.com/ventouxlabs/paperless-go.git main
          BEFORE=$(git rev-parse HEAD)
          git merge --no-edit FETCH_HEAD
          if [ "$(git rev-parse HEAD)" != "$BEFORE" ]; then
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      # Pushes by GITHUB_TOKEN don't trigger workflows, so start the release explicitly
      - if: steps.merge.outputs.changed == 'true'
        run: gh workflow run fork-release.yml -R ${{ github.repository }}
        env:
          GH_TOKEN: ${{ github.token }}
